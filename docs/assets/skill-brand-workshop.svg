<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Brand Workshop — draft your brand DNA before the deeper work">
  <defs>
    <pattern id="dots-brand" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#E8D4A8" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="220" fill="#FDF6E3"/>
  <rect width="800" height="220" fill="url(#dots-brand)"/>

  <g font-family="'Fredoka', 'Nunito', 'Segoe UI', system-ui, sans-serif">
    <text x="40" y="62" font-size="28" font-weight="700" fill="#3D3025">Brand Workshop</text>
    <text x="40" y="92" font-size="14" font-weight="500" fill="#6B5847" font-style="italic">Fourteen guided exercises that take you from</text>
    <text x="40" y="112" font-size="14" font-weight="500" fill="#6B5847" font-style="italic">"I don't know what my brand stands for" to a clean</text>
    <text x="40" y="132" font-size="14" font-weight="500" fill="#6B5847" font-style="italic">draft you can hand to a designer or a strategist.</text>
    <path d="M 40 142 q 40 4, 80 0 t 80 0" fill="none" stroke="#E8957F" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right side: draft → STATE.md → handoff -->

  <!-- Stage 1: pencil + workbook page -->
  <g transform="translate(455, 100)">
    <!-- workbook page -->
    <rect x="-22" y="-30" width="44" height="56" rx="3" fill="#FFF8ED" stroke="#C9A83F" stroke-width="2"/>
    <line x1="-15" y1="-18" x2="15" y2="-18" stroke="#E8957F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#C9A83F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-15" y1="-2" x2="10" y2="-2" stroke="#C9A83F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-15" y1="6" x2="13" y2="6" stroke="#C9A83F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-15" y1="14" x2="8" y2="14" stroke="#C9A83F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- pencil -->
    <g transform="translate(18, 18) rotate(35)">
      <rect x="-12" y="-2" width="20" height="4" fill="#F5D77A" stroke="#C9A83F" stroke-width="1.2"/>
      <polygon points="8,-2 13,0 8,2" fill="#3D3025"/>
      <rect x="-13" y="-2" width="3" height="4" fill="#E8957F"/>
    </g>
    <text x="0" y="62" font-size="13" font-weight="700" fill="#3D3025" text-anchor="middle" font-family="'Fredoka', sans-serif">/brand-start</text>
    <text x="0" y="78" font-size="10" font-weight="500" fill="#6B5847" text-anchor="middle" font-family="'Fredoka', sans-serif">draft</text>
  </g>

  <!-- Stage 2: STATE.md document -->
  <g transform="translate(595, 100)">
    <rect x="-26" y="-30" width="52" height="56" rx="3" fill="#5EBBB3" stroke="#3D8A84" stroke-width="2"/>
    <text x="0" y="-12" font-size="9" font-weight="700" fill="#FFF8ED" text-anchor="middle" font-family="'Fredoka', sans-serif">STATE.md</text>
    <line x1="-18" y1="-2" x2="18" y2="-2" stroke="#FFF8ED" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-18" y1="4" x2="14" y2="4" stroke="#FFF8ED" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-18" y1="10" x2="16" y2="10" stroke="#FFF8ED" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-18" y1="16" x2="10" y2="16" stroke="#FFF8ED" stroke-width="1.4" stroke-linecap="round"/>
    <text x="0" y="62" font-size="13" font-weight="700" fill="#3D3025" text-anchor="middle" font-family="'Fredoka', sans-serif">/brand-export</text>
    <text x="0" y="78" font-size="10" font-weight="500" fill="#6B5847" text-anchor="middle" font-family="'Fredoka', sans-serif">draft ready</text>
  </g>

  <!-- Stage 3: handoff arrow + star (deeper work destination) -->
  <g transform="translate(735, 100)">
    <!-- envelope/handoff icon -->
    <path d="M -22 -16 L 22 -16 L 22 16 L -22 16 Z" fill="#C7A3D9" stroke="#8F6BA5" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -22 -16 L 0 4 L 22 -16" fill="none" stroke="#8F6BA5" stroke-width="2" stroke-linejoin="round"/>
    <!-- star above -->
    <g transform="translate(0, -28)">
      <path d="M 0 -7 L 2 -2 L 7 -1.5 L 3 2 L 4 7 L 0 5 L -4 7 L -3 2 L -7 -1.5 L -2 -2 Z" fill="#F5D77A" stroke="#C9A83F" stroke-width="1"/>
    </g>
    <text x="0" y="62" font-size="13" font-weight="700" fill="#3D3025" text-anchor="middle" font-family="'Fredoka', sans-serif">handoff</text>
    <text x="0" y="78" font-size="10" font-weight="500" fill="#6B5847" text-anchor="middle" font-family="'Fredoka', sans-serif">deeper work</text>
  </g>

  <!-- Connecting dashed arc -->
  <path d="M 455 80 Q 525 55, 595 72 T 735 78" fill="none" stroke="#E8957F" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,5"/>
</svg>
