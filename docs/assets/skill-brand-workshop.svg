<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Brand Workshop — guided brand DNA drafting in your own files">
  <defs>
    <pattern id="dots-brand" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#E8D4A8" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="220" fill="#FDF6E3"/>
  <rect width="800" height="220" fill="url(#dots-brand)"/>

  <g font-family="'Fredoka', 'Nunito', 'Segoe UI', system-ui, sans-serif">
    <text x="40" y="62" font-size="28" font-weight="700" fill="#3D3025">Find your brand DNA</text>
    <text x="40" y="92" font-size="14" font-weight="500" fill="#6B5847" font-style="italic">Fourteen guided conversations that walk a</text>
    <text x="40" y="112" font-size="14" font-weight="500" fill="#6B5847" font-style="italic">founder from "I do not know what my brand</text>
    <text x="40" y="132" font-size="14" font-weight="500" fill="#6B5847" font-style="italic">stands for" to a clean markdown draft.</text>
    <path d="M 40 142 q 40 4, 80 0 t 80 0" fill="none" stroke="#C7A3D9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right side: open workbook with pencil writing on it, friendly face peeking from behind -->
  <g transform="translate(585, 112)">
    <!-- workbook shadow -->
    <path d="M -58 38 Q 0 46, 58 38 L 58 42 Q 0 50, -58 42 Z" fill="#8B7360" opacity="0.18"/>
    <!-- workbook spine -->
    <rect x="-1.5" y="-42" width="3" height="80" fill="#8B7360" opacity="0.4"/>
    <!-- left page -->
    <path d="M -56 -40 Q -56 -42, -54 -42 L -2 -42 L -2 38 L -54 38 Q -56 38, -56 36 Z" fill="#FFF8ED" stroke="#3D3025" stroke-width="2"/>
    <!-- left page lines -->
    <line x1="-48" y1="-28" x2="-10" y2="-28" stroke="#C7A3D9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-48" y1="-18" x2="-18" y2="-18" stroke="#8B7360" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-48" y1="-10" x2="-22" y2="-10" stroke="#8B7360" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-48" y1="-2" x2="-14" y2="-2" stroke="#8B7360" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-48" y1="6" x2="-20" y2="6" stroke="#8B7360" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <text x="-49" y="22" font-size="9" font-weight="700" fill="#5EBBB3" font-family="'Fredoka', sans-serif">PURPOSE</text>
    <!-- right page -->
    <path d="M 2 -42 L 54 -42 Q 56 -42, 56 -40 L 56 36 Q 56 38, 54 38 L 2 38 Z" fill="#FFF8ED" stroke="#3D3025" stroke-width="2"/>
    <!-- right page: handwritten checkmarks on completed exercises -->
    <g transform="translate(10, -30)">
      <path d="M -2 0 L 0 3 L 5 -3" fill="none" stroke="#5EBBB3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="10" y1="0" x2="42" y2="0" stroke="#3D3025" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(10, -18)">
      <path d="M -2 0 L 0 3 L 5 -3" fill="none" stroke="#5EBBB3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="10" y1="0" x2="38" y2="0" stroke="#3D3025" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(10, -6)">
      <path d="M -2 0 L 0 3 L 5 -3" fill="none" stroke="#5EBBB3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="10" y1="0" x2="44" y2="0" stroke="#3D3025" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(10, 6)">
      <path d="M -2 0 L 0 3 L 5 -3" fill="none" stroke="#C7A3D9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="10" y1="0" x2="40" y2="0" stroke="#3D3025" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
    </g>
    <g transform="translate(10, 18)">
      <circle cx="0" cy="0" r="3" fill="none" stroke="#E8957F" stroke-width="1.5" stroke-dasharray="2,2"/>
      <line x1="10" y1="0" x2="36" y2="0" stroke="#3D3025" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>
    </g>
    <!-- pencil writing on right page -->
    <g transform="translate(48, 22) rotate(35)">
      <rect x="-2" y="-22" width="4" height="22" fill="#F5D77A" stroke="#3D3025" stroke-width="1.2"/>
      <path d="M -2 0 L 0 6 L 2 0 Z" fill="#3D3025"/>
      <rect x="-2" y="-26" width="4" height="4" fill="#E8957F" stroke="#3D3025" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Orbit icons: 4 exercise stages around the workbook -->
  <!-- people / stakeholders top-left -->
  <g transform="translate(495, 55)">
    <circle cx="-5" cy="-3" r="4" fill="#5EBBB3" stroke="#3D3025" stroke-width="1.5"/>
    <path d="M -10 8 q 0 -6, 5 -6 q 5 0, 5 6" fill="#5EBBB3" stroke="#3D3025" stroke-width="1.5"/>
    <circle cx="6" cy="-3" r="4" fill="#F5D77A" stroke="#3D3025" stroke-width="1.5"/>
    <path d="M 1 8 q 0 -6, 5 -6 q 5 0, 5 6" fill="#F5D77A" stroke="#3D3025" stroke-width="1.5"/>
    <text x="0" y="26" font-size="9" font-weight="700" fill="#3D3025" text-anchor="middle" font-family="'Fredoka', sans-serif">stakeholders</text>
  </g>
  <!-- target / purpose top-right -->
  <g transform="translate(695, 55)">
    <circle cx="0" cy="0" r="11" fill="#C7A3D9" stroke="#3D3025" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="7" fill="#FFF8ED" stroke="#3D3025" stroke-width="1.3"/>
    <circle cx="0" cy="0" r="3" fill="#E8957F" stroke="#3D3025" stroke-width="1.2"/>
    <text x="0" y="26" font-size="9" font-weight="700" fill="#3D3025" text-anchor="middle" font-family="'Fredoka', sans-serif">purpose</text>
  </g>
  <!-- arrows fork / strategic cascade bottom-left -->
  <g transform="translate(495, 175)">
    <circle cx="-7" cy="0" r="3.2" fill="#5EBBB3" stroke="#3D3025" stroke-width="1.4"/>
    <circle cx="7" cy="-7" r="3.2" fill="#F5D77A" stroke="#3D3025" stroke-width="1.4"/>
    <circle cx="7" cy="7" r="3.2" fill="#E8957F" stroke="#3D3025" stroke-width="1.4"/>
    <line x1="-4" y1="-1" x2="4" y2="-6" stroke="#3D3025" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="1" x2="4" y2="6" stroke="#3D3025" stroke-width="1.5" stroke-linecap="round"/>
    <text x="0" y="24" font-size="9" font-weight="700" fill="#3D3025" text-anchor="middle" font-family="'Fredoka', sans-serif">cascade</text>
  </g>
  <!-- checklist / values bottom-right -->
  <g transform="translate(695, 175)">
    <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#F5D77A" stroke="#3D3025" stroke-width="1.6"/>
    <path d="M -5 -1 L -2 2 L 4 -5" fill="none" stroke="#3D3025" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-5" y1="5" x2="4" y2="5" stroke="#3D3025" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
    <text x="0" y="24" font-size="9" font-weight="700" fill="#3D3025" text-anchor="middle" font-family="'Fredoka', sans-serif">values</text>
  </g>

  <!-- dashed orbit lines -->
  <path d="M 510 75 q 30 -15, 65 -10" fill="none" stroke="#8B7360" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3,4" opacity="0.55"/>
  <path d="M 595 50 q 35 0, 70 15" fill="none" stroke="#8B7360" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3,4" opacity="0.55"/>
  <path d="M 510 165 q 30 10, 65 5" fill="none" stroke="#8B7360" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3,4" opacity="0.55"/>
  <path d="M 595 180 q 35 5, 70 -5" fill="none" stroke="#8B7360" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3,4" opacity="0.55"/>
</svg>
