<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Brand Workshop · Resources — printable workbook, filled example, and facilitator guide">
  <defs>
    <pattern id="dots-brand-r" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#E8D4A8" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="220" fill="#FDF6E3"/>
  <rect width="800" height="220" fill="url(#dots-brand-r)"/>

  <g font-family="'Fredoka', 'Nunito', 'Segoe UI', system-ui, sans-serif">
    <text x="40" y="62" font-size="28" font-weight="700" fill="#3D3025">A workbook for finding your brand</text>
    <text x="40" y="92" font-size="14" font-weight="500" fill="#6B5847" font-style="italic">Printable companion to the Brand Workshop skill.</text>
    <text x="40" y="112" font-size="14" font-weight="500" fill="#6B5847" font-style="italic">Empty workbook, fully filled fictional example,</text>
    <text x="40" y="132" font-size="14" font-weight="500" fill="#6B5847" font-style="italic">and a facilitator guide for cohort leads.</text>
    <path d="M 40 142 q 40 4, 80 0 t 80 0" fill="none" stroke="#E8957F" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right side: stacked workbook + filled-in example + facilitator card -->
  <g transform="translate(490, 30)">
    <path d="M 0 165 L 280 165" stroke="#8B7360" stroke-width="2" stroke-linecap="round"/>

    <!-- Workbook (back, plain) -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="86" height="110" rx="3" fill="#FFF8ED" stroke="#C9A83F" stroke-width="2"/>
      <line x1="10" y1="18" x2="76" y2="18" stroke="#E8957F" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="32" x2="65" y2="32" stroke="#C9A83F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <line x1="10" y1="44" x2="68" y2="44" stroke="#C9A83F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <line x1="10" y1="56" x2="60" y2="56" stroke="#C9A83F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <line x1="10" y1="72" x2="76" y2="72" stroke="#C9A83F" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="10" y1="84" x2="58" y2="84" stroke="#C9A83F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <line x1="10" y1="96" x2="64" y2="96" stroke="#C9A83F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <text x="43" y="124" font-size="9" font-weight="600" fill="#6B5847" text-anchor="middle">empty workbook</text>
    </g>

    <!-- Filled example (middle, with marks) -->
    <g transform="translate(110, 35)">
      <rect x="0" y="0" width="86" height="125" rx="3" fill="#FFF8ED" stroke="#5EBBB3" stroke-width="2"/>
      <text x="43" y="16" font-size="10" font-weight="700" fill="#3D8A84" text-anchor="middle" font-family="'Fredoka', sans-serif">Lumen Coffee</text>
      <line x1="10" y1="26" x2="76" y2="26" stroke="#3D8A84" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="10" y1="38" x2="64" y2="38" stroke="#3D8A84" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="10" y1="50" x2="72" y2="50" stroke="#3D8A84" stroke-width="1.2" stroke-linecap="round"/>
      <!-- check marks -->
      <path d="M 14 64 L 18 68 L 24 60" stroke="#5EBBB3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="30" y1="64" x2="76" y2="64" stroke="#3D8A84" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 14 80 L 18 84 L 24 76" stroke="#5EBBB3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="30" y1="80" x2="68" y2="80" stroke="#3D8A84" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 14 96 L 18 100 L 24 92" stroke="#5EBBB3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="30" y1="96" x2="72" y2="96" stroke="#3D8A84" stroke-width="1.2" stroke-linecap="round"/>
      <text x="43" y="119" font-size="9" font-weight="600" fill="#6B5847" text-anchor="middle">filled example</text>
    </g>

    <!-- Facilitator card (front) -->
    <g transform="translate(200, 60)">
      <rect x="0" y="0" width="74" height="100" rx="3" fill="#C7A3D9" stroke="#8F6BA5" stroke-width="2"/>
      <text x="37" y="20" font-size="10" font-weight="700" fill="#FFF8ED" text-anchor="middle" font-family="'Fredoka', sans-serif">Facilitator</text>
      <text x="37" y="32" font-size="9" font-weight="600" fill="#FFF8ED" text-anchor="middle" font-family="'Fredoka', sans-serif">Guide</text>
      <line x1="10" y1="44" x2="64" y2="44" stroke="#FFF8ED" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="10" y1="54" x2="58" y2="54" stroke="#FFF8ED" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="10" y1="64" x2="64" y2="64" stroke="#FFF8ED" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="10" y1="74" x2="50" y2="74" stroke="#FFF8ED" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="10" y1="84" x2="60" y2="84" stroke="#FFF8ED" stroke-width="1.2" stroke-linecap="round"/>
      <text x="37" y="114" font-size="9" font-weight="600" fill="#6B5847" text-anchor="middle">facilitator guide</text>
    </g>
  </g>
</svg>
